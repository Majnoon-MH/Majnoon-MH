name: Update profile (snake + cards)

on:
  schedule:
    # Every 3 hours, at minute 23 (minute 0 is the busiest time on GitHub,
    # and busy jobs can be delayed or skipped).
    - cron: "23 */3 * * *"
  workflow_dispatch: # the "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: # run again only when these files change (not on every README edit)
      - ".github/workflows/profile.yml"
      - "scripts/**"

# Needed so the job can write to the "output" branch.
permissions:
  contents: write

# Never run two copies at the same time.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 1) The snake. "snake-neon" (dark mode) uses the SAME green colors as
      #    your profile graph, with a neon green snake. "snake" is for light mode.
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-neon.svg?color_snake=#00ff9d&color_dots=#161b22,#01311f,#034525,#0f6d31,#00c647

      # 1b) Violet gradient background. If this step has a problem it only
      #     prints a warning and the plain snake is published.
      - name: Make the snake violet
        run: |
          python3 scripts/style_snake.py dist/snake-neon.svg dark
          python3 scripts/style_snake.py dist/snake.svg light

      # 2) The cards (streak, stats, languages), made by our own script.
      #    If this step fails we still publish the snake (see last step).
      - name: Generate cards
        id: cards
        continue-on-error: true
        run: python3 scripts/generate_cards.py --out dist
        env:
          # Optional: add a secret named PROFILE_TOKEN (a token with the
          # "read:user" scope) to count PRIVATE contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      # 3) Publish to the "output" branch. keep_files keeps the old cards if
      #    step 2 failed, so the README never shows a broken image.
      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      # 4) Make the job red if the cards failed, so you can see it.
      - name: Fail if cards failed
        if: steps.cards.outcome == 'failure'
        run: |
          echo "::error::The cards step failed. Open that step in the log."
          exit 1
