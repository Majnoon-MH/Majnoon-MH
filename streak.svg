<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img" aria-label="GitHub streak">
<title>GitHub streak</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00ff9d"/><stop offset="1" stop-color="#00c8ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .big   { font-size: 38px; font-weight: 700; fill: #c9d1d9; }
  .label { font-size: 15px; font-weight: 600; fill: #00ff9d; }
  .sub   { font-size: 12px; fill: #8b949e; }
  .title { font-size: 17px; font-weight: 700; fill: #00ff9d; }
  .row   { font-size: 14px; fill: #c9d1d9; }
  .val   { font-size: 14px; font-weight: 700; fill: #c9d1d9; }
  .fade  { opacity: 0; animation: fade .6s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes ring { from { stroke-dashoffset: var(--len); } }
  .ring { animation: ring 1.2s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; opacity: 1; } .ring { animation: none; }
  }
</style>
<rect x="0.5" y="0.5" rx="12" width="799" height="189" fill="#0d1117" stroke="#30363d"/>
<line x1="267" y1="35" x2="267" y2="150" stroke="#30363d"/>
<line x1="533" y1="35" x2="533" y2="150" stroke="#30363d"/>
<g class="fade" style="animation-delay:.1s" text-anchor="middle">
  <text x="133" y="92" class="big">27</text>
  <text x="133" y="124" class="label">Total Contributions</text>
  <text x="133" y="146" class="sub">Nov 18 - Present</text>
</g>
<g text-anchor="middle">
  <circle cx="400" cy="82" r="42" fill="none" stroke="#30363d" stroke-width="6"/>
  <circle class="ring" style="--len:131.9" cx="400" cy="82" r="42" fill="none" stroke="url(#g)"
          stroke-width="6" stroke-linecap="round" stroke-dasharray="131.9 263.9"
          transform="rotate(-90 400 82)" filter="url(#glow)"/>
  <text x="400" y="94" class="big" style="font-size:34px">2</text>
  <circle cx="400" cy="38" r="15" fill="#0d1117"/>
  <g transform="translate(400 38) scale(0.8)" fill="url(#g)"><path d="M0,-13 C7,-6 10,-2 10,3 C10,9 5,13 0,13 C-5,13 -10,9 -10,3 C-10,-1 -7,-4 -5,-8 C-4,-5 -3,-4 -1,-4 C1,-7 0,-10 0,-13 Z"/></g>
  <text x="400" y="148" class="label" style="font-size:16px">Current Streak</text>
  <text x="400" y="168" class="sub">Nov 23 - Nov 24</text>
</g>
<g class="fade" style="animation-delay:.3s" text-anchor="middle">
  <text x="667" y="92" class="big">4</text>
  <text x="667" y="124" class="label">Longest Streak</text>
  <text x="667" y="146" class="sub">Nov 18 - Nov 21</text>
</g>
<text x="786" y="180" text-anchor="end" class="sub" style="font-size:10px">updated 2026-11-24 13:38 UTC</text>
</svg>
