<svg xmlns="http://www.w3.org/2000/svg" width="390" height="190" viewBox="0 0 390 190" role="img" aria-label="GitHub stats">
<title>GitHub stats</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00ff9d"/><stop offset="1" stop-color="#00c8ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .big   { font-size: 38px; font-weight: 700; fill: #c9d1d9; }
  .label { font-size: 15px; font-weight: 600; fill: #00ff9d; }
  .sub   { font-size: 12px; fill: #8b949e; }
  .title { font-size: 17px; font-weight: 700; fill: #00ff9d; }
  .row   { font-size: 14px; fill: #c9d1d9; }
  .val   { font-size: 14px; font-weight: 700; fill: #c9d1d9; }
  .fade  { opacity: 0; animation: fade .6s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes ring { from { stroke-dashoffset: var(--len); } }
  .ring { animation: ring 1.2s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; opacity: 1; } .ring { animation: none; }
  }
</style>
<rect x="0.5" y="0.5" rx="12" width="389" height="189" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="34" class="title">GitHub Stats</text>
<g class="fade" style="animation-delay:0.1s"><circle cx="30" cy="61" r="5" fill="#00ff9d"/><text x="46" y="66" class="row">Public repositories</text><text x="366" y="66" text-anchor="end" class="val">1</text></g>
<g class="fade" style="animation-delay:0.2s"><circle cx="30" cy="86" r="5" fill="#ffd33d"/><text x="46" y="91" class="row">Stars earned</text><text x="366" y="91" text-anchor="end" class="val">0</text></g>
<g class="fade" style="animation-delay:0.3s"><circle cx="30" cy="111" r="5" fill="#00c8ff"/><text x="46" y="116" class="row">Followers</text><text x="366" y="116" text-anchor="end" class="val">0</text></g>
<g class="fade" style="animation-delay:0.4s"><circle cx="30" cy="136" r="5" fill="#c792ea"/><text x="46" y="141" class="row">Pull requests</text><text x="366" y="141" text-anchor="end" class="val">0</text></g>
<g class="fade" style="animation-delay:0.5s"><circle cx="30" cy="161" r="5" fill="#ff7b72"/><text x="46" y="166" class="row">Issues</text><text x="366" y="166" text-anchor="end" class="val">0</text></g>
<text x="376" y="182" text-anchor="end" class="sub" style="font-size:10px">updated 2026-11-28 10:10 UTC</text>
</svg>
